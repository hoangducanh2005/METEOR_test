[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pnk-comet-autolabel"
version = "0.1.0"
description = "PNK raw to T4Dataset adapter and open-source 2D autolabel runner for METEOR"
requires-python = ">=3.11"
dependencies = [
  "laspy[lazrs]>=2.5",
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.10",
  "pillow>=10",
  "pycocotools>=2.0.7",
  "scipy>=1.13",
  "scikit-image>=0.24",
]

[project.optional-dependencies]
mask2former = [
  "accelerate>=1.0",
  "safetensors>=0.4",
  "torch>=2.4",
  "torchvision>=0.19",
  "transformers>=4.45",
]

[project.scripts]
pnk-autolabel = "pnk_comet_autolabel.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
